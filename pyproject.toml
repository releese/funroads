[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funroads"
version = "0.1.0"
description = "Deterministic pipeline that scores Dutch roads for driving fun and builds ranked Sunday-drive circuits, rendered in a single-page map."
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["funroads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
